name: Extended checks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv run python -m openworkflow_adk.tools.benchmark --iterations 10 --max-p99-ms 5000

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv run mutmut run --max-children 2 > /tmp/owf-mutmut.log 2>&1
      - run: uv run python scripts/check_mutation_score.py /tmp/owf-mutmut.log

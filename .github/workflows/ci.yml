name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Current local baseline is 83%; keep a small margin for platform variance.
      - run: uv run pytest --cov=openworkflow_adk --cov-report=term-missing --cov-fail-under=80

  compatibility-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        adk-version: ["2.6.3"]
        spec-version: ["1.0.3"]
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run python -c "import importlib.metadata as m; assert m.version('google-adk') == '${{ matrix.adk-version }}'"
      - run: uv run pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv export --no-dev --no-emit-project --format requirements-txt > /tmp/owf-requirements.txt
      - run: uv run pip-audit -r /tmp/owf-requirements.txt --no-deps --disable-pip --strict
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: owf-adk-sbom.spdx.json

  memory-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv run pytest tests/resources/test_memory_integration.py
        env:
          WORKFLOW_RUN_INTEGRATION_TESTS: "1"

name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Architecture layering contract: the translator/runtime must never pull
      # tools/ops into core (C24.18).
      - run: uv run lint-imports
      # Fast unit job: Docker-backed integration tests run in the separate
      # `integration` job below. Unit coverage gate is set lower because the
      # Docker-covered modules (postgres history, polling worker) are excluded.
      - run: uv run pytest -m "not integration" --cov=openworkflow_adk --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - name: Run Docker-backed integration suite
        run: uv run pytest -m integration --cov=openworkflow_adk --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  compatibility-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        adk-version: ["2.6.3"]
        spec-version: ["1.0.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run python -c "import importlib.metadata as m; assert m.version('google-adk') == '${{ matrix.adk-version }}'"
      - run: uv run pytest -m "not integration"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv export --no-dev --no-emit-project --format requirements-txt > /tmp/owf-requirements.txt
      - run: uv run pip-audit -r /tmp/owf-requirements.txt --no-deps --disable-pip --strict
      - uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: owf-adk-sbom.spdx.json

  memory-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv run pytest tests/resources/test_memory_integration.py
        env:
          WORKFLOW_RUN_INTEGRATION_TESTS: "1"

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install actionlint-py zizmor
      - run: actionlint
      - run: zizmor --format sarif .github/workflows > zizmor-results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: zizmor-results.sarif

[project]
name = "open-workflow-agent-adk"
version = "0.1.0"
description = "Translates OpenWorkflow Specification documents into runnable ADK agentic components"
requires-python = ">=3.10"
dependencies = [
    "google-adk",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

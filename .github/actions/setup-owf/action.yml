name: Setup OWF environment

description: |
  Install uv and Python, and sync dependencies after the caller checks out the repository.

inputs:
  python-version:
    description: Python version to install
    required: true
  sync-args:
    description: Arguments passed to uv sync
    required: false
    default: "--frozen --all-extras"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - run: uv sync ${{ inputs.sync-args }}
      shell: bash

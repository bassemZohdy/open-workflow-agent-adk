name: Setup OWF environment

description: |
  Check out the repository, install uv and Python, and sync dependencies.

inputs:
  python-version:
    description: Python version to install
    required: true
  sync-args:
    description: Arguments passed to uv sync
    required: false
    default: "--frozen --all-extras"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v9
      with:
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - run: uv sync ${{ inputs.sync-args }}
      shell: bash

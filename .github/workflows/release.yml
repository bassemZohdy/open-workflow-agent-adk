name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Assert tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(uvx --from toml-cli toml get --toml-path pyproject.toml project.version)
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi

  publish:
    needs: [test, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-owf
        with:
          python-version: "3.12"
          sync-args: "--frozen --no-dev"
      - run: uv build
      - name: Validate distributions
        run: uvx --from twine twine check dist/*
      - name: Smoke-test built wheel
        run: |
          uv venv /tmp/owf-smoke --python python3.12
          /tmp/owf-smoke/bin/pip install dist/*.whl
          /tmp/owf-smoke/bin/owf-adk --version
          /tmp/owf-smoke/bin/python -c "import openworkflow_adk"
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Extract CHANGELOG section for release
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk '/^## /{if (found) exit; if ($2 == "'"$VERSION"' —" || $2 == "'"$VERSION"'") found=1} found' CHANGELOG.md)
          EOF=$(openssl rand -hex 12)
          {
            echo "body<<$EOF"
            echo "$SECTION"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}

name: ADK Canary

# Runs the unit test suite against the latest google-adk release each night so
# drift in the private workflow APIs consumed through adk_compat.py (C24.19) is
# detected before it reaches users. Failures here are informational: the pinned
# compatibility matrix in ci.yml remains the release gate.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Validate the committed lockfile
        run: uv lock --check --offline
      - name: Sync the pinned baseline
        run: uv sync --frozen --all-extras
      - name: Install latest google-adk (unpinned)
        run: |
          uv pip install --reinstall --upgrade "google-adk"
          # Do not let uv run restore the manifest's pinned ADK before the test.
          uv run --no-sync python - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path

          version = metadata.version("google-adk")
          print("google-adk", version)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              env.write(f"ADK_CANARY_VERSION={version}\n")
          PY
      - name: Verify the upgraded ADK is still installed
        run: |
          uv run --no-sync python -c "
          import importlib.metadata as metadata
          import os
          assert metadata.version('google-adk') == os.environ['ADK_CANARY_VERSION'], \
              'The upgraded canary ADK was replaced before testing'
          "
      - name: Run unit suite against latest ADK
        id: unit-tests
        run: uv run --no-sync pytest -m "not integration" -q
      - name: Report unit-suite failure
        if: failure() && steps.unit-tests.outcome == 'failure'
        run: |
          echo "::warning::The unit suite failed against the installed latest google-adk."
          echo "Inspect the failed tests before attributing the failure to " \
            "src/openworkflow_adk/adk_compat.py."
      - name: Report environment failure
        if: failure() && steps.unit-tests.outcome != 'failure'
        run: |
          echo "::warning::Canary environment setup failed before the unit suite ran."
          echo "Inspect lock validation, dependency installation and package metadata above."
